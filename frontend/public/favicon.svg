<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#0B1320" />
    </linearGradient>
    <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="gradArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Neon Emerald Glow -->
  <rect width="512" height="512" rx="256" fill="url(#gradBg)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gradRing)" stroke-width="16" filter="url(#glow)" />
  
  <!-- Glowing Upward Trendline & Arrow -->
  <path d="M 120 340 L 210 250 L 290 300 L 390 170" fill="none" stroke="url(#gradArrow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 310 170 L 390 170 L 390 250" fill="none" stroke="url(#gradArrow)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
